services:
  # ==============================================================================
  # CyberDuel AI — Command Center Dashboard (Static Site)
  # Free & fast global edge hosting on Render
  # ==============================================================================
  - type: web
    name: cyberduel-dashboard
    runtime: static
    rootDir: apps/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set this to your live backend URL in Render dashboard, e.g. https://cyberduel-api.onrender.com

  # ==============================================================================
  # CyberDuel AI FastAPI Backend (Web Service)
  # ==============================================================================
  - type: web
    name: cyberduel-api
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER_TYPE
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: API_V1_PREFIX
        value: /api/v1
